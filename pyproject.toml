[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-agent-rsi"
version = "0.1.0"
description = "Minimal environment-evolution harness for stateful tool-using agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["datasets>=2.13", "pyarrow>=12"]
test = ["pytest>=7"]

[project.scripts]
env-agent-rsi-agent0-data = "env_agent_rsi.integrations.agent0.dataset:main"
env-agent-rsi-agent0-server = "env_agent_rsi.integrations.agent0.tool_server:main"
env-agent-rsi-agent0-train = "env_agent_rsi.integrations.agent0.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
